# config/builtin_models.yaml — 声明式内置模型。
# 本文件在 app 容器启动时自动重放到 models 表（is_builtin=true，对所有租户可见）；
# 编辑后重启 app 即生效。从文件移除的条目不会自动从数据库删除，需手工清理。
#
# 生产环境由 docker-compose 的 tei 服务提供 bge-m3（BAAI/bge-m3，1024 维，
# 最大 8192 token），app 经 OpenAI 兼容 /v1/embeddings 调用（generic provider）。
# BGE 查询前缀由应用内置处理，无需在此配置。
builtin_models:
  - id: builtin-embedding-bge-m3
    type: Embedding
    source: remote
    is_default: true
    name: bge-m3
    parameters:
      base_url: http://tei:80/v1
      api_key: tei-local # TEI 无鉴权；占位非空即可
      provider: generic
      # CPU 版 TEI 吞吐上限约 115 tok/s，是全链路瓶颈。并发开高只会让请求
      # 在 TEI 里排 200s+ 队、撞 app 300s 超时后重试，形成"队列越长→超时越
      # 多→重试越多"的死循环（实测 1400%+ CPU 零产出）。故并发固定 2、单批
      # 4 条：两个批刚好填满 TEI 的 --max-batch-tokens 8192，排队趋近 0。
      max_concurrency: 2
      spec:
        compat:
          request_timeout_seconds: 300
          max_batch_size: 4
      embedding_parameters:
        dimension: 1024
        truncate_prompt_tokens: 8192
