# Shared backend proxy settings for the /api/ and /mcp/ locations.
#
# The API, skill-upload and MCP locations share headers and streaming behavior.
# Only proxy_pass stays in each location, since a regex location cannot carry
# a URI in it.
#
# This file is copied verbatim, not run through envsubst, so $host and friends
# survive as nginx variables.

# Preserve the public port for same-origin embed API checks on HTTP deployments.
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
# 保留上游（宝塔 nginx）声明的协议，否则外部 https 访问会被容器内的
# $scheme=http 覆盖，后端据此生成的绝对外链（资源短链、预签名 URL）会退化成 http。
# 变量在 nginx-http.conf 的 map 里定义：上游没传时回退到 $scheme。
proxy_set_header X-Forwarded-Proto $weknora_forwarded_proto;

# 连接和重试配置
proxy_connect_timeout 30s;                 # 连接超时时间
proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
proxy_next_upstream_tries 3;               # 重试次数
proxy_next_upstream_timeout 30s;           # 重试超时时间

# SSE 相关配置
proxy_http_version 1.1;                    # 使用 HTTP/1.1
proxy_set_header Connection "";            # 禁用 Connection: close，保持连接打开
chunked_transfer_encoding off;             # 关闭分块传输编码
proxy_buffering off;                       # 关闭缓冲
proxy_cache off;                           # 关闭缓存
proxy_read_timeout 3600s;                  # 增加读取超时时间
proxy_send_timeout 3600s;                  # 增加发送超时时间
