# HTTP-context nginx snippets for the frontend image.
# Included from conf.d (http {}), not from the server template.

# $uri is the path without the query string, so handshake tickets (and any
# leftover secrets) never land in access logs.
log_format api_no_query '$remote_addr - $remote_user [$time_local] '
                        '"$request_method $uri $server_protocol" $status '
                        '$body_bytes_sent "$http_referer" "$http_user_agent"';

# X-Forwarded-Proto 透传：优先用上游（宝塔 nginx）声明的协议，没传则回退到本次
# 连接的 $scheme。直接在 proxy_set_header 里写 $scheme 会在反向代理后把外部
# https 一律改写成 http（容器内监听 80），后端生成的绝对外链就会跟着变成 http。
map $http_x_forwarded_proto $weknora_forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}
